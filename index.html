    'use strict';
    // Standard normal CDF: rational approximation in the central region,
    // continued fraction in the tails. Absolute error is near double precision.
    const SQRT_2PI = Math.sqrt(2 * Math.PI);
    function normalPDF(x) { return Math.exp(-0.5 * x * x) / SQRT_2PI; }
    function normalCDF(x) {
      if (Number.isNaN(x)) return NaN;
      if (x === 0) return 0.5;
      const y = Math.abs(x);
      if (y > 37) return x > 0 ? 1 : 0;
      const e = Math.exp(-0.5 * y * y);
      let tail;
      if (y < 7.0710678118654755) {
        const n = ((((((0.0352624965998911*y+0.700383064443688)*y+6.37396220353165)*y+33.9128660783830)*y+112.079291497871)*y+221.213596169931)*y+220.206867912376);
        const d = (((((((0.0883883476483184*y+1.75566716318264)*y+16.0641775792070)*y+86.7807322029461)*y+296.564248779674)*y+637.333633378831)*y+793.826512519948)*y+440.413735824752);

        tail = e / (y + 1/(y + 2/(y + 3/(y + 4/(y + 0.65))))) / SQRT_2PI;

    }
    // T in YEARS, sigma/r/q in decimals. Greeks per option share;
    // theta per calendar day, vega per one percentage point of IV.
    // European exercise, continuous compounding, constant volatility.
    function blackScholes(type, S, K, T, sigma, r=0.04, q=0) {
      if (!['put','call'].includes(type) || ![S,K,T,sigma,r,q].every(Number.isFinite) || S<0 || K<=0 || T<0 || sigma<0) throw new RangeError('Invalid Black–Scholes inputs');

        const callDelta = S>K ? 1 : S<K ? 0 : 0.5;
        return {price:Math.max(call?S-K:K-S,0),delta:call?callDelta:callDelta-1,gamma:0,theta:0,vega:0};
      }
      const dq=Math.exp(-q*T), dr=Math.exp(-r*T);
      if (S === 0) return {price:call?0:K*dr,delta:call?0:-dq,gamma:0,theta:call?0:r*K*dr/365,vega:0};

        const forwardDiff=S*dq-K*dr, active=call?forwardDiff>0:forwardDiff<0;

        price:Math.max(0,call?S*dq*normalCDF(d1)-K*dr*normalCDF(d2):K*dr*normalCDF(-d2)-S*dq*normalCDF(-d1)),

    const DEFAULT_SCENARIO = {s:135,iv:65,days:30,r:4};
    const multiplier = leg => leg.type==='stock'?1:100;
    function mark(leg, scenario, spot=scenario.s, expiry=false) {
      if (leg.type==='stock') return {price:spot,delta:1,gamma:0,theta:0,vega:0};

    }
    let nextId=0;
    function makeLeg(type,strike,qty,scenario,tag='custom') {

    function createBook(scenario=DEFAULT_SCENARIO, mode='ratio') {

    // Exact piecewise-linear expiry roots on the WHOLE domain S>=0,
    // including flat zero intervals and the unbounded final segment.
    function expiryAnalysis(book,scenario) {
      const knots=[...new Set([0,...book.legs.filter(l=>l.type!=='stock').map(l=>l.strike)])].sort((a,b)=>a-b);

    // Simulated close/reopen at the same mark preserves total P&L at execution.

      if(!old)return book;
      const realized=book.realized+old.qty*multiplier(old)*(mark(old,scenario).price-old.entry);

    window.ThetaEngine={normalCDF,normalPDF,blackScholes,mark,pnl,portfolioGreeks,expiryAnalysis,createBook,makeLeg,replaceLeg,DEFAULT_SCENARIO};

      const rootText=[...analysis.roots.map(x=>usd(x)),...analysis.intervals.map(([a,b])=>usd(a)+'–'+(b===Infinity?'∞':usd(b)))].join(' / ')||'无';
      useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),3500);return()=>clearTimeout(t);},[toast]);
      function updateScenario(key,value){setScenario(s=>({...s,[key]:value}));}
      function transact(next,message,newScenario=scenario){
        setHistory(h=>[...h.slice(-39),{book,scenario}]);
        setBook({...next,log:[{id:Date.now()+Math.random(),message,s:scenario.s,iv:scenario.iv,days:scenario.days},...next.log].slice(0,60)});
        setScenario({...newScenario});setToast(message);
      }
      function preset(mode){
        // A short-dated, lower-IV educational example has a central PROFIT peak.
        // Loading it explicitly starts a new book; it is not a cost-free hedge.
        const s=mode==='w'?{s:135,iv:25,days:1,r:4}:{...DEFAULT_SCENARIO};
        transact(createBook(s,mode),mode==='w'?'已新建 W 型示例：S $135 / IV 25% / 1 天；历史盈亏重置':'已新建默认 1:−2 比率价差；历史盈亏重置',s);
      }
      function toggleProtection(){
        if(protection){transact(replaceLeg(book,protection.id,null,scenario),'已按当前理论价平仓保护腿，损益计入已实现盈亏');}
        else{const leg=makeLeg('put',targetStrike,2,scenario,'protection');transact({...book,legs:[...book.legs,leg],mode:'custom'},`已买入 2 张 $${targetStrike} Put，支出 ${usd(leg.entry*200)}`);}
      }
      function protect(){if(!protection)toggleProtection();}
      function completeW(){
        const additions=[];
        if(!protection)additions.push(makeLeg('put',targetStrike,2,scenario,'protection'));
        if(!book.legs.some(l=>l.tag==='wing'))additions.push(makeLeg('call',135,1,scenario,'wing'));
        if(!additions.length){setToast('保护腿与右侧 Call 已存在；可在持仓中调整');return;}
        const cost=additions.reduce((s,l)=>s+l.entry*l.qty*100,0);
        transact({...book,legs:[...book.legs,...additions],mode:'custom'},`已叠加 W 保护腿 / 右侧 Call，新增成本 ${usd(cost)}；实际形状取决于当前持仓`);
      }
      function roll(){
        if(!rollLeg||rollStrike===rollLeg.strike)return;
        const leg=makeLeg('put',rollStrike,rollLeg.qty,scenario,'short');
        const cash=rollLeg.qty*100*(mark(rollLeg,scenario).price-leg.entry);
        transact(replaceLeg(book,rollLeg.id,leg,scenario),`同到期日 Roll Down：$${rollLeg.strike} → $${rollStrike} Put；净现金流 ${usd(cash)}`);
      }
      function hedge(){
        if(!hedgeShares)return;
        const leg=makeLeg('stock',0,hedgeShares,scenario,'hedge');
        transact({...book,legs:[...book.legs,leg],mode:'custom'},`已${hedgeShares<0?'卖空':'买入'} ${Math.abs(hedgeShares)} 股，成交价 ${usd(scenario.s)}，Delta 残差 ≤ 0.5 股`);
      }
      function editLeg(leg,field,value){
        if(field==='entry'){
          transact({...book,legs:book.legs.map(l=>l.id===leg.id?{...l,entry:value}:l)},'已修正入场成本基准（非交易）；历史盈亏随基准调整');return;
        }
        const changed={...leg,[field]:value};
        if(field==='type'&&value!=='stock'&&changed.strike===0)changed.strike=135;
        changed.tag='custom';changed.entry=mark(changed,scenario).price;
        transact(replaceLeg(book,leg.id,changed,scenario),'已按当前理论价平旧开新；原腿损益已结算');
      }
      function undo(){const prev=history[history.length-1];if(!prev)return;setBook(prev.book);setScenario(prev.scenario);setHistory(h=>h.slice(0,-1));setToast('已撤销最近一次持仓操作，并恢复操作时的沙盘参数');}
      const wReady=book.legs.length===4&&book.legs.some(l=>l.type==='put'&&l.strike===135&&l.qty===1)&&book.legs.some(l=>l.type==='put'&&l.strike===125&&l.qty===-2)&&book.legs.some(l=>l.type==='put'&&l.strike===115&&l.qty===2)&&book.legs.some(l=>l.type==='call'&&l.strike===135&&l.qty===1);
      return <div className="max-w-[1600px] mx-auto px-4 md:px-8 pb-6">
        <header className="flex items-center justify-between py-5 border-b border-[#25303e] gap-3">
          <div className="flex items-center gap-3"><div className="bg-[#a7f36b] text-[#15220d] rounded-lg p-2"><Icon name="tree" size={25}/></div><div className="text-xl font-semibold tracking-tight">ThetaTree <span className="text-[10px] mono muted ml-2 desktop-label">OPTIONS LAB</span></div><div className="h-5 border-l border-[#344051] mx-3 hidden md:block"/><span className="text-xs muted hidden md:block">策略研究终端</span></div>
          <div className="flex items-center gap-4"><span className="badge muted hidden sm:inline-flex"><span className="dot"/> 本地模拟 · 无实盘连接</span><button className="btn btn-ghost" onClick={()=>setInfo(!info)} aria-expanded={info}>模型说明 ↗</button></div>
        </header>
        <section className="flex flex-wrap justify-between items-end gap-5 pt-7 pb-6">
          <div><div className="eyebrow mb-2">STRATEGY WORKSPACE / 01</div><h1 className="text-xl md:text-[27px] font-semibold tracking-tight">期权 1:−2 比率价差<span className="text-[#74839a] mx-2">/</span>W 型策略</h1><p className="text-xs muted mt-2">动态移仓与风险沙盘 <span className="mx-2">·</span> 调整市场情景，观察每一条腿如何改变收益。</p></div>
          <div data-testid="signal" data-state={breached?'red':'green'} role="status" className={'rounded-lg border px-4 py-3 flex gap-3 items-center '+(breached?'border-[#73404b] bg-[#321c25] negative':'border-[#344f30] bg-[#172519] positive')}><span className="dot"/><div><div className="text-xs font-semibold">{breached?'跌破卖方行权价 · 需要关注':'未触发卖方行权价预警'}</div><div className="text-[10px] opacity-70 mono mt-1">{trigger===null?'NO SHORT PUT':`S ${fmt(scenario.s)} ${breached?'<':'≥'} K ${fmt(trigger)}`} · {greeks.gamma<0?'SHORT GAMMA':'LONG GAMMA'}</div></div></div>
        </section>
        {info&&<section className="panel p-5 mb-5 text-xs leading-6 muted"><h2 className="text-sm text-white mb-2">模型与记账口径</h2><p>SPCX / SpaceX 为用户指定的模拟标识，$135 为假设初始价格，不代表真实上市状态或行情。欧式 Black–Scholes 模型，统一到期日、统一 IV，股息率 q = 0，默认年化无风险利率 4%；每张期权 100 股，正股按股计算。不计手续费、滑点、保证金、借券费、资金利息及提前行权。</p><p>总损益 = 已实现盈亏 + Σ 数量 × 合约乘数 ×（当前价值 − 入场价）。滑块只改变估值情景，不改变入场成本；T 为假设剩余期限。到期线不受 S / IV / T 改变；S 改变光标，IV / T 改变当日曲线。移仓按当前理论价平旧开新；成本字段为手工修正历史基准。所有到期盈亏平衡点在 S ≥ 0 上精确分段求解。</p><p>Delta：等效持股数；Gamma：标的每涨 $1 的 Delta 变化；Theta：每自然日美元变化；Vega：IV 每增加 1 个百分点的美元变化。Roll Down 保持到期日，不模拟跨期展期。W 型两谷不保证微亏，期权成本和既有移仓损失决定曲线高度；左端盈利受 S ≥ 0 限制。</p><p className="mt-2">公式参考：<a href="https://martin-haugh.github.io/files/FoundationsFE/BlackScholes.pdf" target="_blank" rel="noreferrer">Martin Haugh · The Black–Scholes Model</a>；即时绘图：<a href="https://www.chartjs.org/docs/latest/developers/updates.html" target="_blank" rel="noreferrer">Chart.js 无动画更新</a>。</p></section>}
        <section className="panel grid grid-cols-2 lg:grid-cols-4 divide-x divide-[#25303e] mb-5">
          <div className="stat"><div className="eyebrow">SCENARIO P&L <span className="float-right">当日损益</span></div><div data-testid="pnl" className={'stat-value mono mt-3 '+tone(current)}>{usd(current)}</div><div className="metric-small mt-2">同价到期 <span className={'mono '+tone(atExpiry)}>{usd(atExpiry)}</span></div></div>
          <div className="stat"><div className="eyebrow">NET DELTA <span className="float-right">Δ</span></div><div data-testid="delta" className="stat-value mono mt-3">{signed(greeks.delta)}</div><div className="metric-small mt-2">等效持股 · <span className="mono">股</span></div></div>
          <div className="stat"><div className="eyebrow">NET GAMMA <span className="float-right">Γ</span></div><div data-testid="gamma" className={'stat-value mono mt-3 '+(greeks.gamma<0?'negative':'positive')}>{signed(greeks.gamma,3)}</div><div className="metric-small mt-2">Delta 变化 · <span className="mono">股 / $1</span></div></div>
          <div className="stat"><div className="eyebrow">TIME & VOLATILITY <span className="float-right">Θ / ν</span></div><div className="flex gap-6 mt-3"><div><div className={'mono text-lg '+tone(greeks.theta)}>{signed(greeks.theta)}</div><div className="metric-small mt-1">Theta · $ / 天</div></div><div><div className={'mono text-lg '+tone(greeks.vega)}>{signed(greeks.vega)}</div><div className="metric-small mt-1">Vega · $ / 1% IV</div></div></div></div>
        </section>
        <div className="workspace">
          <main className="min-w-0 space-y-5">
            <section className="panel">
              <div className="panel-head"><div className="flex gap-2 items-center"><Icon name="chart"/><h2 className="font-semibold text-sm">收益结构</h2><span className="badge text-[#a7f36b]">{wReady?'W STRUCTURE':'RATIO / CUSTOM'}</span></div><div className="hidden sm:flex gap-4 text-[10px]"><span><span className="inline-block w-4 border-t-2 border-[#a7f36b] mr-2 align-middle"/>到期损益</span><span><span className="inline-block w-4 border-t-2 border-dashed border-[#55c9ee] mr-2 align-middle"/>当日动态</span></div></div>
              <div className="px-5 pt-4 flex justify-between gap-3"><div><span className="font-semibold">SPCX</span><span className="muted text-xs ml-2">SpaceX · 模拟标的</span><span className="mono ml-3">{usd(scenario.s)}</span></div><span className="eyebrow pt-1">PAYOFF PROFILE</span></div>
              <div className="flex gap-4 text-[10px] sm:hidden px-5 pt-3"><span className="positive">— 到期损益</span><span className="text-[#55c9ee]">┄ 当日动态</span></div>
              <PayoffChart book={book} scenario={scenario} analysis={analysis}/>
              {wReady&&<div className="grid grid-cols-5 mx-5 mb-4 border border-[#293745] rounded-lg text-center text-[10px] muted"><div className="zone"><span className="positive">↖ 左翼拉升</span><div className="mono mt-1">S &lt; 115</div></div><div className="zone"><span className="negative">左谷 · 保护成本</span><div className="mono mt-1">{usd(pnl(book,scenario,115,true),0)}</div></div><div className="zone"><span className="positive">中心尖峰</span><div className="mono mt-1">{usd(pnl(book,scenario,125,true),0)}</div></div><div className="zone"><span className="negative">右谷 · 权利金</span><div className="mono mt-1">{usd(pnl(book,scenario,135,true),0)}</div></div><div className="zone"><span className="positive">右翼盈利 ↗</span><div className="mono mt-1">S &gt; 135</div></div></div>}
              <div className="divider grid grid-cols-1 sm:grid-cols-3 text-xs"><div className="px-5 py-3"><div className="muted text-[10px]">到期盈亏平衡点 · 全域</div><div data-testid="breakeven" className="mono mt-1 break-words text-[#cdd9e9]">{rootText}</div></div><div className="px-5 py-3"><div className="muted text-[10px]">到期最大盈利 · S ≥ 0</div><div className={'mono mt-1 '+tone(analysis.max)}>{analysis.max===Infinity?'无限上行':usd(analysis.max)}</div></div><div className="px-5 py-3"><div className="muted text-[10px]">到期最大亏损 · S ≥ 0</div><div className="mono mt-1 negative">{analysis.min===-Infinity?'无限亏损':usd(Math.max(0,-analysis.min))}</div></div></div>
            </section>
            <section className="panel p-5"><div className="flex items-center justify-between mb-4"><h2 className="font-semibold text-sm flex gap-2 items-center"><Icon name="bolt"/>实时情景沙盘</h2><button className="text-[10px] muted hover:text-white" onClick={()=>setScenario({...DEFAULT_SCENARIO})}>重置参数 ↺</button></div><div className="grid grid-cols-1 md:grid-cols-3 gap-3"><Slider id="spot-slider" label="标的现价" symbol="S" value={scenario.s} min={90} max={170} step={0.1} format={v=>'$'+fmt(v,1)} onChange={v=>updateScenario('s',v)}/><Slider id="iv-slider" label="隐含波动率" symbol="IV" value={scenario.iv} min={15} max={100} step={1} format={v=>v+'%'} onChange={v=>updateScenario('iv',v)}/><Slider id="days-slider" label="剩余天数" symbol="T" value={scenario.days} min={1} max={60} step={1} format={v=>v+' 天'} onChange={v=>updateScenario('days',v)}/></div><p className="text-[10px] muted mt-3">固定入场成本 · 参数变化即时重估；到期折线保持不变，现价定位线与动态曲线同步更新。</p></section>
            <section className="panel overflow-hidden">
              <div className="panel-head flex-wrap"><div><h2 className="font-semibold text-sm">持仓构建器 <span className="mono text-xs muted ml-2">{book.legs.length} LEGS</span></h2></div><div className="flex gap-2 flex-wrap"><button className="btn btn-ghost" onClick={undo} disabled={!history.length}>撤销</button><button className="btn" onClick={()=>transact({...book,legs:[...book.legs,makeLeg('put',Math.round(scenario.s/5)*5,1,scenario)],mode:'custom'},'已按当前理论价新增 1 张 Put')}>＋ 添加腿</button></div></div>
              <div className="px-5 py-3 flex flex-wrap gap-2"><button className={'btn '+(!protection?'btn-ghost':'border-[#628949] text-[#a7f36b]')} onClick={toggleProtection} aria-pressed={!!protection}>{protection?'✓ 平仓保护腿':`＋ 2× $${targetStrike} Put 保护`}</button><button className="btn btn-ghost" onClick={completeW}>叠加 W 左右翼</button></div>
              <div className="overflow-x-auto"><table className="trade-table"><thead><tr><th>方向 / 数量</th><th>合约类型</th><th>行权价 $</th><th>入场价 $ / 股</th><th>理论价 $ / 股</th><th>Delta · 股</th><th>浮动损益 $</th><th><span className="sr-only">操作</span></th></tr></thead><tbody>{book.legs.map((leg,i)=>{const m=mark(leg,scenario);return <tr key={leg.id}><td><div className="flex items-center gap-2"><span className={'text-[9px] w-7 '+(leg.qty>0?'positive':'negative')}>{leg.qty>0?'BUY':'SELL'}</span><NumberField label={`第${i+1}腿数量`} value={leg.qty} min={-10000} max={10000} step={1} nonzero onCommit={v=>editLeg(leg,'qty',v)}/></div></td><td><select aria-label={`第${i+1}腿类型`} value={leg.type} onChange={e=>editLeg(leg,'type',e.target.value)}><option value="put">PUT</option><option value="call">CALL</option><option value="stock">正股</option></select></td><td>{leg.type==='stock'?<span className="muted">—</span>:<NumberField label={`第${i+1}腿行权价`} min={1} max={10000} value={leg.strike} onCommit={v=>editLeg(leg,'strike',v)}/>}</td><td><NumberField label={`第${i+1}腿入场价`} min={0} max={100000} value={Number(leg.entry.toFixed(6))} onCommit={v=>editLeg(leg,'entry',v)}/></td><td className="mono">{fmt(m.price,4)}</td><td className="mono">{signed(m.delta*leg.qty*multiplier(leg))}</td><td className={'mono '+tone((m.price-leg.entry)*leg.qty)}>{signed((m.price-leg.entry)*leg.qty*multiplier(leg))}</td><td><button className="muted hover:text-[#ff7388]" aria-label={`平仓第${i+1}腿`} onClick={()=>transact(replaceLeg(book,leg.id,null,scenario),'已平仓该腿，浮动损益转入已实现盈亏')}><Icon name="close" size={14}/></button></td></tr>;})}{!book.legs.length&&<tr><td colSpan="8" className="text-center muted">当前为空仓。添加腿或载入预设以继续模拟。</td></tr>}</tbody></table></div>
              <div className="px-5 py-3 divider flex justify-between flex-wrap gap-3 text-[11px]"><span className="muted">持仓净{netBasis>=0?'支出':'收入'} <span className="mono text-white ml-2">{usd(Math.abs(netBasis))}</span></span><span className="muted">已实现盈亏 <span data-testid="realized" className={'mono ml-2 '+tone(book.realized)}>{usd(book.realized)}</span></span></div><p className="px-5 pb-4 text-[10px] muted">数量：正数买入、负数卖出；期权按张、正股按股。修改类型 / 数量 / 行权价会平旧开新；入场价可手工修正。输入后按 Enter 或移开焦点生效。</p>
            </section>
          </main>
          <aside className="space-y-5 min-w-0">
            <section className="panel"><div className="panel-head"><h2 className="font-semibold text-sm flex items-center gap-2"><Icon name="shield"/>动态移仓助手</h2><span className={'badge '+(breached?'negative':'positive')}>{breached?'TRIGGERED':'MONITORING'}</span></div><div className="p-4">
              <div role={breached?'alert':'status'} className={'rounded-lg p-3 mb-4 text-xs leading-6 '+(breached?'bg-[#321c25] text-[#f5a5b1]':'bg-[#1b2920] text-[#b8d5a6]')}>{breached?`现价 ${usd(scenario.s)} 已跌破卖方行权价 ${usd(trigger)}。${nakedLeft?'下跌方向仍有尾部亏损敞口。':'已有左侧保护，但谷底亏损仍需关注。'}`:trigger===null?'当前无卖出 Put，未启用下破触发。':'等待下破卖方行权价；绿灯仅表示未触发，不代表组合无风险。'}<div className="text-[10px] opacity-80 mt-1">Net Δ {signed(greeks.delta)} · Net Γ {signed(greeks.gamma,3)}</div></div>
              <div className="assistant-grid space-y-3">
                <div className="side-card"><div className="eyebrow mb-2">01 / LEFT TAIL</div><h3 className="text-sm font-semibold">追买 ${targetStrike} Put</h3><p className="text-[11px] muted mt-2 mb-3">买入 2 张低行权价 Put，抬升左侧尾部。当前预计支出 <span className="mono text-[#d4deed]">{usd(mark({type:'put',strike:targetStrike},scenario).price*200)}</span>；保护成本会加深谷底。</p><button className="btn btn-primary w-full" onClick={protect} disabled={!!protection}>{protection?'保护腿已持有':'一键执行此对冲'}</button></div>
                <div className="side-card"><div className="eyebrow mb-2">02 / ROLL DOWN</div><h3 className="text-sm font-semibold">卖方腿向下移仓</h3><p className="text-[11px] muted mt-2 mb-3">{rollLeg?`平仓 ${Math.abs(rollLeg.qty)} 张 $${rollLeg.strike} Put 空头，重新卖出 $${rollStrike} Put。保持同一到期日，可能产生净支出；平仓损益保留。`:'当前没有可向下移仓的 Put 空头。'}</p><button className="btn w-full" onClick={roll} disabled={!rollLeg||rollStrike===rollLeg.strike}>执行 Roll Down ↓</button></div>
                <div className="side-card"><div className="eyebrow mb-2">03 / DELTA HEDGE</div><h3 className="text-sm font-semibold">正股 Delta 对冲</h3><p className="text-[11px] muted mt-2 mb-3">{hedgeShares===0?'Delta 已接近中性。':`${hedgeShares<0?'卖空':'买入'} ${Math.abs(hedgeShares)} 股，抵消当前 ${signed(greeks.delta)} 股 Delta。`}对冲后 Gamma 仍保留，后续价格变化需要重新评估。</p><button className="btn w-full" onClick={hedge} disabled={hedgeShares===0}>{hedgeShares===0?'已达到 Delta 中性':`执行${hedgeShares<0?'卖空':'买入'} ${Math.abs(hedgeShares)} 股`}</button></div>
              </div>
            </div></section>
            <section className="guide p-5"><div className="eyebrow text-[#93ba7e] mb-2">STRATEGY PRESETS</div><h2 className="font-semibold text-sm">从比率价差，构建 W 双翼</h2><p className="text-[11px] muted leading-6 my-3">+1 P135 −2 P125 +2 P115 形成左侧保护谷；再加入 +1 C135，才能形成完整 W。双谷 $115 / $135，中心尖峰 $125。</p><div className="flex gap-2"><button className="btn btn-ghost flex-1" onClick={()=>preset('ratio')}>默认比率价差</button><button className="btn btn-primary flex-1" onClick={()=>preset('w')}>W 型示例 ↗</button></div><p className="text-[10px] muted mt-3">预设会新建仓位、重置盈亏。W 示例采用 1 天 / IV 25%，展示约 $141 双谷亏损和 $859 中央盈利；可撤销。</p></section>
            <section className="panel"><div className="panel-head"><h2 className="font-semibold text-sm">Black–Scholes 计算器</h2><span className="eyebrow">EUROPEAN</span></div><div className="p-4"><div className="grid grid-cols-3 gap-2 mb-4"><label className="text-[10px] muted">类型<select aria-label="计算器类型" className="mt-1" value={calc.type} onChange={e=>setCalc(c=>({...c,type:e.target.value}))}><option value="put">PUT</option><option value="call">CALL</option></select></label><label className="text-[10px] muted">行权价 $<div className="mt-1"><NumberField label="计算器行权价" value={calc.strike} min={1} max={10000} onCommit={v=>setCalc(c=>({...c,strike:v}))}/></div></label><label className="text-[10px] muted">年化利率 %<div className="mt-1"><NumberField label="无风险利率" value={scenario.r} min={-5} max={30} onCommit={v=>updateScenario('r',v)}/></div></label></div><div className="flex justify-between items-center mb-3"><span className="text-xs muted">理论期权价格</span><span data-testid="calc-price" className="mono text-xl positive">{usd(single.price,4)}</span></div><div className="grid grid-cols-2 gap-3 text-xs">{[['Delta',single.delta],['Gamma',single.gamma],['Theta / 天',single.theta],['Vega / 1% IV',single.vega]].map(([label,value])=><div key={label} className="flex justify-between border-t border-[#25303e] pt-2"><span className="muted">{label}</span><span className="mono">{fmt(value,4)}</span></div>)}</div><p className="text-[10px] muted mt-3">同步沙盘 S / IV / T / r。价格与 Greeks 均按每股计；组合统计已乘以 100。</p></div></section>
          </aside>
        </div>
        <section className="panel mt-5"><details><summary className="px-5 py-4 text-xs"><span className="font-semibold">模拟交易记录</span><span className="mono muted ml-3">{book.log.length} EVENTS</span></summary><div className="ledger divider">{book.log.length?book.log.map(item=><div key={item.id} className="flex flex-wrap justify-between gap-2 px-5 py-3 border-b border-[#202c3c] text-[11px]"><span>{item.message}</span><span className="mono muted">S ${fmt(item.s)} · IV {item.iv}% · {item.days}D</span></div>):<div className="px-5 py-4 text-xs muted">暂无交易。滑块变化不记作成交。</div>}</div></details></section>
        <footer className="mt-6 flex flex-wrap justify-between gap-2 text-[10px] muted"><span className="mono">THETATREE / OPTIONS RESEARCH TERMINAL</span><span>理论情景模拟 · 无实时行情 · 所有操作仅修改本地模拟仓位</span></footer>
        {toast&&<div className="toast text-xs" role="status">{toast}</div>}
      </div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
